name: Deploy static demo to GitHub Pages

# MANUAL ONLY. This publishes the SYNTHETIC DEMO as a static site on GitHub
# Pages (free, no domain, no paid plan, no secrets). It never runs on push, so
# no branch can accidentally publish. It deploys no backend and collects no
# data. Publishing is intended for owner-approved demo sharing only.
#
# Before enabling: in the repo Settings → Pages, set "Source: GitHub Actions".

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish-demo" to confirm this is the synthetic demo'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-demo"
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish-demo" ]; then
            echo "Refusing: confirmation phrase did not match."
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:coverage

      # A project site is served under /<repo>/, so set the asset base.
      - name: Build (project sub-path base)
        env:
          VITE_BASE: "/${{ github.event.repository.name }}/"
        run: npm run build

      - name: Copy SPA fallback and block search indexing
        run: |
          cp dist/index.html dist/404.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
