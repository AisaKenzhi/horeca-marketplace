name: Local Supabase database tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-db:
    name: Ephemeral local database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start local Postgres database
        run: supabase db start
      - name: Run database tests
        run: supabase test db
